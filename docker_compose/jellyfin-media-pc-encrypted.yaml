name: jellyfin-media-pc-encrypted

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin-media-pc-encrypted
    restart: unless-stopped

    user: "1000:1000"

    environment:
      - JELLYFIN_DATA_DIR_ENCRYPTED=/data
      - JELLYFIN_CONFIG_DIR_ENCRYPTED=/config
      - JELLYFIN_CACHE_DIR_ENCRYPTED=/cache

    volumes:
      - type: bind
        source: ${JELLYFIN_DATA_DIR_ENCRYPTED:?Set JELLYFIN_DATA_DIR_ENCRYPTED}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${JELLYFIN_CONFIG_DIR_ENCRYPTED:?Set JELLYFIN_CONFIG_DIR_ENCRYPTED}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${JELLYFIN_CACHE_DIR_ENCRYPTED:?Set JELLYFIN_CACHE_DIR_ENCRYPTED}
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${JELLYFIN_MEDIA_DIR_ENCRYPTED:?Set JELLYFIN_MEDIA_DIR_ENCRYPTED}
        target: /media
        read_only: true
        bind:
          create_host_path: false

    devices:
      - /dev/dri/card1:/dev/dri/card1
      - /dev/dri/renderD128:/dev/dri/renderD128

    group_add:
      - "44" # video
      - "992" # render

    ports:
      - "${JELLYFIN_HTTP_PORT_ENCRYPTED:-18096}:8097"
      - "${JELLYFIN_HTTPS_PORT_ENCRYPTED:-18920}:8921"
