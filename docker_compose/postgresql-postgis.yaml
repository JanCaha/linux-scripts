services:
  postgres:
    container_name: $CONTAINER_NAME
    image: postgis/postgis:17-master
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      PGDATA: /data/postgres
    user: "${UID}:${GID}"
    volumes:
      - ${HOME}/PG_Data:/data/postgres
      - ${HOME}:/home
    ports:
      - "5432:5432"
    command:
      [
        "postgres",
        "-c",
        "logging_collector=on",
        "-c",
        "log_statement=all",
        "-c",
        "log_directory=/tmp",
      ]
